[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alexnet-pytorch"
version = "0.2.1"
description = "Clean and modern PyTorch implementation of AlexNet (Krizhevsky et al., 2012)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Stanley Samwel", email = "owinostanley03@gmail.com"}
]
keywords = ["pytorch", "alexnet", "deep-learning", "computer-vision", "cnn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0.0"]
train = ["tqdm>=4.65.0", "matplotlib>=3.7.0"]
dev = ["pytest>=7.0.0", "black", "ruff", "tqdm>=4.65.0"]

[project.urls]
Homepage = "https://github.com/Stanley03-arch/alexnet-pytorch"
Repository = "https://github.com/Stanley03-arch/alexnet-pytorch"
Issues = "https://github.com/Stanley03-arch/alexnet-pytorch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["alexnet*"]
